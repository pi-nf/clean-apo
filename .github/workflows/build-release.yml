name: Build & Release Clean APO

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller --clean -y clean_apo.spec

      - name: Prepare distribution archive
        shell: pwsh
        run: |
          mkdir dist-package
          Copy-Item dist\CleanAPO.exe dist-package\
          Copy-Item README.md dist-package\
          Compress-Archive -Path dist-package\* -DestinationPath dist\CleanAPO-Windows-x64.zip

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CleanAPO-Windows-x64
          path: |
            dist/CleanAPO.exe
            dist/CleanAPO-Windows-x64.zip

      - name: Release on GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/CleanAPO.exe
            dist/CleanAPO-Windows-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
